name: Builder Image

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/auv-builder
          tags: |
            type=raw,value=latest
            type=sha,value={{sha}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get runner UID/GID
        id: id
        run: |
          set -e
          uid=$(id -u)
          gid=$(id -g)
          echo "UID: $uid, GID: $gid"
          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          echo "gid=$gid" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UID=${{ steps.id.outputs.uid }}
            GID=${{ steps.id.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old image versions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: /users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}%2Fauv-builder/versions
        run: |
          # Keep the version tagged latest and the 3 newest others.
          gh api --paginate "$VERSIONS" \
            --jq '.[] | select(any(.metadata.container.tags[]; . == "latest") | not) | "\(.created_at) \(.id)"' |
            sort -r | tail -n +4 | while read -r _ id; do
              echo "Deleting version $id"
              gh api -X DELETE "$VERSIONS/$id"
            done
