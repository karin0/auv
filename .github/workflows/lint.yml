name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # pyalpm builds only against libalpm, so pyright reads its stub under typings instead.
      - run: uv sync --locked --only-group dev

      - run: uv run --no-sync ruff check

      - run: uv run --no-sync ruff format --check

      - run: uv run --no-sync pyright

      - run: shellcheck -- *.sh scripts/*.sh

      # actionlint reads only workflow files; the composite action.yml stays outside its reach.
      - run: |
          bash <(curl -sSfL --max-time 60 https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
