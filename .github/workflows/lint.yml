name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.2.0

      # pyalpm builds only against libalpm, so pyright reads its stub under typings instead.
      - run: uv sync --locked --only-group dev

      - run: uv run --no-sync ruff check

      - run: uv run --no-sync ruff format --check

      - run: uv run --no-sync pyright

      - run: shellcheck -- *.sh scripts/*.sh

      # actionlint reads only workflow files; the composite action.yml stays outside its reach.
      - run: |
          bash <(curl -sSfL --max-time 60 https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
