name: AUR Voyager
description: Build and publish AUR packages to releases
inputs:
  release_tag:
    description: 'Release tag name'
    required: true
  packages_file:
    description: 'Path to the packages list file'
    required: true
  repo_name:
    description: 'Pacman repository name'
    required: false
  makepkg_conf_file:
    description: 'Path to the makepkg.conf file'
    required: false
  patches_dir:
    description: 'Path to the build patches directory'
    required: false
  gpg_private_key:
    description: 'GPG private key for signing'
    required: false
  gpg_key_id:
    description: 'GPG key ID for signing (defaults to first secret key)'
    required: false
  telegram_bot_token:
    description: 'Telegram Bot Token for notifications'
    required: false
  telegram_chat_id:
    description: 'Telegram Chat ID for notifications'
    required: false
  builder_image:
    description: 'Custom builder image'
    required: false
outputs:
  updated:
    description: 'Whether the repository was updated'
    value: ${{ steps.build.outputs.sync }}

runs:
  using: composite
  steps:
    - name: Restore Pacman Packages Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pacman-cache
        key: pacman-${{ inputs.release_tag }}-${{ github.run_id }}
        restore-keys: |
          pacman-${{ inputs.release_tag }}-

    - name: Restore AUR Clones Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: clones
        key: clones-${{ inputs.release_tag }}-${{ github.run_id }}
        restore-keys: |
          clones-${{ inputs.release_tag }}-

    - name: Download Existing Database
      shell: bash
      run: |
        echo '::group::=== Fetching existing database ==='
        ${{ github.action_path }}/scripts/fetch-assets.sh ${{ inputs.release_tag }}
        res=$?
        echo '::endgroup::'
        [[ $res -ne 0 ]] && echo '::warning::Failed to fetch existing assets.'
        exit $res
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    - name: Build Packages in Arch Container
      id: build
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository || github.repository }}
      run: |
        echo '::group::=== Building packages in container ==='
        mkdir -p pacman-cache clones
        image="${{ inputs.builder_image }}"
        if [[ -z $image ]]; then
          repo=$(echo "$ACTION_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repo/auv-builder:latest"
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"
        docker run \
          -v "${{ github.action_path }}":/action:ro \
          -v "$PWD":/workspace \
          -v "$PWD/pacman-cache":/var/cache/pacman/pkg \
          -w /workspace \
          -e GITHUB_REPOSITORY=${{ github.repository }} \
          -e CI=1 \
          -e AUV_SIGN="${{ inputs.gpg_private_key && '1' }}" \
          -e AUV_REPO_NAME="${{ inputs.repo_name || inputs.release_tag }}" \
          -e AUV_PACKAGES_FILE="${{ inputs.packages_file }}" \
          -e AUV_MAKEPKG_CONF_FILE="${{ inputs.makepkg_conf_file }}" \
          -e AUV_PATCHES_DIR="${{ inputs.patches_dir }}" \
          "$image" \
          /action/scripts/build.sh ${{ inputs.release_tag }}
        res=$?
        if [[ $res -eq 0 ]]; then
          sudo chown -R $USER:$USER pacman-cache clones
          cd "state/${{ inputs.release_tag }}"
          if [[ -s notify.txt ]]; then
            echo "sync=1" >> "$GITHUB_OUTPUT"
            echo "changed=1" >> "$GITHUB_OUTPUT"
          elif [[ -s obsolete-assets.txt ]]; then
            echo "sync=1" >> "$GITHUB_OUTPUT"
          fi
        fi
        echo '::endgroup::'
        exit $res

    # PKGBUILDs run in the build container with passwordless sudo, so the key only enters a
    # fresh container that sees nothing but the built repository.
    - name: Sign Packages in Fresh Container
      if: steps.build.outputs.changed == '1' && inputs.gpg_private_key != ''
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg_private_key }}
        GPG_KEY_ID: ${{ inputs.gpg_key_id }}
        IMAGE: ${{ steps.build.outputs.image }}
      run: |
        echo '::group::=== Signing packages in container ==='
        docker run --rm \
          -v "${{ github.action_path }}":/action:ro \
          -v "$PWD/repos/${{ inputs.release_tag }}":/repo \
          -e GPG_PRIVATE_KEY \
          -e GPG_KEY_ID \
          "$IMAGE" \
          /action/scripts/sign.sh /repo "${{ inputs.repo_name || inputs.release_tag }}"
        echo '::endgroup::'

    - name: Synchronize Release Assets
      if: steps.build.outputs.sync == '1'
      shell: bash
      run: |
        echo '::group::=== Synchronizing release assets ==='
        ${{ github.action_path }}/scripts/sync-assets.sh ${{ inputs.release_tag }}
        res=$?
        echo '::endgroup::'
        exit $res
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}

    - name: Save Pacman Packages Cache
      if: steps.build.outputs.changed == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pacman-cache
        key: pacman-${{ inputs.release_tag }}-${{ github.run_id }}

    - name: Save AUR Clones Cache
      if: steps.build.outputs.changed == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: clones
        key: clones-${{ inputs.release_tag }}-${{ github.run_id }}
