[project]
name = "auv"
version = "0.1.0"
authors = [{ name = "karin0", email = "karin0@gmx.com" }]
requires-python = ">=3.14"
dependencies = ["pyalpm>=0.10.12"]

[dependency-groups]
dev = ["ruff>=0.15.12", "pyright>=1.1.409"]

[tool.uv]
exclude-newer = "15 days"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL", "ANN401"]
ignore = [
    "A", "ANN", "ARG", "COM812", "CPY", "D", "EM", "ERA", "FAST", "FBT", "PLR", "PTH", "TD",
    "BLE001", "C901", "N818", "PLC0415", "PLW1508", "PLW2901", "RET503", "S101", "SLF001",
    "TC001", "TC002", "TC003", "TC006", "TRY003", "TRY004",
    # auv drives the pacman and aurutils tools found on PATH.
    "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
"auv.py" = ["T20"]
"scripts/*.py" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "PEP 649 lazy annotations are the 3.14 default"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.format]
quote-style = "preserve"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
